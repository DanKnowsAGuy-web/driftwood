<head>

<title>Driftwood</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#F7F4EE;--surface:#FFFFFF;--ink:#1C2823;--muted:#66716B;--accent:#B4622D;--line:#E2DCD0;}
@media (prefers-color-scheme: dark){:root{--paper:#131A17;--surface:#1B2420;--ink:#E9E5DC;--muted:#98A29B;--accent:#D98A52;--line:#2C3833;}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:40px 36px;max-width:420px;width:100%;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 12px;}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;margin:0 0 8px;}
p{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.5;}
input{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);margin:0 0 12px;}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
button{width:100%;padding:12px;font-size:15px;font-weight:600;font-family:inherit;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;}
button:hover{filter:brightness(1.06);}
.err{color:#B4372D;font-size:13px;margin:10px 0 0;display:none;}
</style>
</head>
<body>

    <button type="submit">View the report</button>

  </form>
</div>

async function tryUnlock(pw){
  try{
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:un(SALT), iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:un(IV)}, key, un(CT));
    const html = new TextDecoder().decode(pt);
    sessionStorage.setItem("dw_pw", pw);
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const ok = await tryUnlock(document.getElementById("pw").value.trim().toLowerCase());
  if(!ok) document.getElementById("err").style.display = "block";
});
const saved = sessionStorage.getItem("dw_pw");
if(saved) tryUnlock(saved);
